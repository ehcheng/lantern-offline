# Lantern sshd drop-in (FIXES #152, a8 F3 / a6 F9; decision D4-A). The image
# bakes FIRST_USER_PASS, and the router bridges eth0 onto the open LIBRARY
# Wi-Fi, so password login must be off. Key: the builder's files/lantern_ed25519.pub is
# installed to /home/lantern/.ssh/authorized_keys at build (01-run.sh); the
# private half is NOT in the image or the library (RUNBOOK/binder say where).
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
