# Lantern nginx (BUILD_PLAN C2 / R7). PRIMARY captive-portal responder —
# the OpenWrt router only does wildcard DNS (address=/#/10.10.10.10), it
# serves NO HTTP. Per-OS probe rules (verified in C4 nspawn, re-verified
# E2 on real phones, extended R7 for full probe superset):
#
#  - Android (AOSP / Google): connectivitycheck.gstatic.com/generate_204,
#    /gen_204, connectivitycheck.android.com/generate_204, and
#    clients3.google.com/generate_204 must NOT return 204 — a 302
#    triggers the sign-in sheet.
#  - iOS / macOS: captive.apple.com/hotspot-detect.html (and several
#    alternative Apple probe hosts) must NOT return the exact body
#    "<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>"
#    — a 302 triggers the CNA sheet. Same for /library/test/success.html.
#  - Windows 10 1607+ (NCSI): msftconnecttest.com/connecttest.txt must NOT
#    return exactly "Microsoft Connect Test" — a 302 triggers the toast.
#    Legacy Windows 8.1-: msftncsi.com/ncsi.txt (same logic).
#  - Firefox: detectportal.firefox.com/success.txt and /canonical.html
#    must NOT return the expected content — a 302 opens the portal tab.
#  - ChromeOS: same gstatic probes as Android.
#  - Samsung: uses standard Android gstatic probes (no Samsung-unique URL).
#  - Xiaomi MIUI: connect.rom.miui.com/generate_204 — treat same as AOSP.
#  - KDE NetworkManager: networkcheck.kde.org/ — redirect.
#  - GNOME NetworkManager: nmcheck.gnome.org/check_network_status.txt —
#    redirect (already present pre-R7).
#
# Catch-all heuristic (at bottom of default_server): any request from an
# unknown host whose path looks like a probe path (generate_204, gen_204,
# connecttest.txt, ncsi.txt, hotspot-detect, success.txt, canonical.html,
# check_network_status.txt) redirects to library.lan/ — covers future probe
# URL drift without a config rebuild. All other unknown-host requests also
# fall through to the default_server 302, because wildcard DNS routes every
# hostname here anyway.

# FIXES #152 (a8 F5): no "nginx/1.22.1" in Server: / error pages. http context
# (sites-enabled/* is included inside http{}), so it covers both servers.
server_tokens off;

# ── Explicit captive-probe server block ────────────────────────────────────
# Handles every known probe host by name so nginx can match them before
# the default_server. All get a flat 302 → library.lan/ regardless of path.
server {
    listen 80;
    # Apple (iOS, macOS, tvOS, watchOS)
    server_name captive.apple.com
                www.apple.com
                apple.com
    # Android / Google / ChromeOS
                connectivitycheck.gstatic.com
                clients3.google.com
                clients1.google.com
                connectivitycheck.android.com
                www.google.com
                gstatic.com
    # Xiaomi MIUI
                connect.rom.miui.com
    # Qualcomm (some MIUI / Huawei fallback)
                www.qualcomm.cn
    # Windows 10+ NCSI
                www.msftconnecttest.com
                msftconnecttest.com
                ipv6.msftconnecttest.com
    # Windows ≤8.1 NCSI (legacy)
                www.msftncsi.com
                msftncsi.com
    # Firefox
                detectportal.firefox.com
    # GNOME NetworkManager
                nmcheck.gnome.org
    # KDE NetworkManager
                networkcheck.kde.org
    ;
    location / { return 302 http://library.lan/; }
}

# ── The library itself ─────────────────────────────────────────────────────
# default_server catches every other wildcard-DNS name (the router sends
# ALL hostnames here). JS-off compatible: plain 302, no JS redirect.
server {
    listen 80 default_server;
    server_name library.lan library.local 10.10.10.10 _;
    root /data/library;
    index index.html;
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    # range requests for pmtiles/mbtiles/video
    add_header Accept-Ranges bytes;

    # ── Catch-all probe-path heuristic ──────────────────────────────────
    # Covers unknown-host probe URLs that are NOT matched by the explicit
    # server block above — probe path patterns drift across OS versions,
    # but these path shapes are stable across all known variants.
    # Only fires when Host != library.lan or 10.10.10.10 (i.e. a stray probe
    # host that slipped past the named block above).
    # ponytail: regex match on every request; negligible at LAN scale.
    set $is_probe 0;
    if ($host !~* "^library\.(lan|local)$") { set $is_probe 1; }
    if ($host = "10.10.10.10")           { set $is_probe 0; }
    if ($request_uri ~* "/(generate_204|gen_204|connecttest\.txt|ncsi\.txt|hotspot-detect|success\.txt|canonical\.html|check_network_status\.txt|redirect|ping)") {
        set $is_probe "${is_probe}1";
    }
    if ($is_probe = "11") { return 302 http://library.lan/; }

    # ── Unknown-host catch-all (non-probe paths) ─────────────────────────
    # Any hostname that is NOT library.lan/10.10.10.10 but has arrived here
    # (wildcard DNS) and didn't match a probe path → still redirect to the
    # library. This is the final line of defence against any uncaught probe.
    if ($host !~* "^(library\.lan|library\.local|10\.10\.10\.10)$") {
        return 302 http://library.lan/;
    }

    # FIXES #151 (a8 F2, b4 F2): the Kolibri home (db.sqlite3 with password
    # hashes once provisioned, sessions, logs with client IPs) and the MCP
    # index (raw page text incl. the dose paragraphs the dose guard withholds)
    # live under the web root. ^~ beats the regex locations below. Kolibri
    # serves its own content on :8081; nothing in library/ links under here
    # except LICENSES.html / known_gaps.html (text mentions only).
    location ^~ /kolibri_data/ { return 404; }
    location ^~ /_app/mcp/     { return 404; }

    location / {
        try_files $uri $uri/ =404;
        autoindex on;   # index_v1.html (plain version) links to folders
    }
    # disc images loop-mounted by lantern-discs.service: browse a CD3WD DVD like a folder
    # #179 (RT2 b5 101b): ^~ so the regex type locations below cannot win over the alias (every disc .csv 404'd under the
    # library root); the nested regex locations inherit the alias and keep the csv/mjs types inside /discs/.
    location ^~ /discs/ {
        alias /srv/discs/; autoindex on;
        location ~* \.csv$ { types {} default_type text/csv; charset utf-8; }
        location ~* \.mjs$ { types {} default_type text/javascript; charset utf-8; }
    }
    # image version stamp (build_boot_image.sh); library version is /VERSION.json
    location = /image-release.txt { alias /etc/lantern-release; default_type text/plain; }
    # RUNBOOK/REFRESH/MAINTENANCE_PROMPT .md are read in the browser, not downloaded
    location ~* \.md$ { types {} default_type text/plain; charset utf-8; }
    location ~* \.csv$ { types {} default_type text/csv; charset utf-8; }
    # Android browsers install .apk only with the right type
    location ~* \.apk$ { types {} default_type application/vnd.android.package-archive; }
    # pdf.js is an ES module (pdf.mjs); Debian mime.types has no mjs, and a module served as octet-stream is refused by browsers
    location ~* \.mjs$ { types {} default_type text/javascript; charset utf-8; }
    # Kolibri captions (54k .vtt): Debian mime.types has no vtt -> octet-stream (b4 F4, a4 N9)
    location ~* \.vtt$ { types {} default_type text/vtt; charset utf-8; }
    # MCP server (lantern-mcp.service, :8090). /.well-known/mcp.json and
    # /llms.txt are plain files under root — no dotfile deny rule here.
    # R15 voice STT (lantern-voice.service, whisperfile :8092). Browser mic
    # needs a secure context, so phones on plain http won't show the button;
    # the endpoint still serves curl/apps/localhost.
    location /stt {
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:8092/inference;
        proxy_read_timeout 120s;
    }
    # H37b semantic search for search.html (same lantern-mcp process, :8090)
    # a8 F5 (round 9, #252): the server echoes Access-Control-Allow-Origin for a localhost Origin (dev only, search.html
    # on :8765 calling :8090); through nginx no Origin reaches it, so no CORS header leaves the box
    location /semantic {
        proxy_pass http://127.0.0.1:8090/semantic;
        proxy_set_header Origin "";
        proxy_read_timeout 15s;
    }
    location /mcp {
        proxy_pass http://127.0.0.1:8090/mcp;
        proxy_set_header Origin "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # #188 (RT3 b4 N4): a dead link gets library/_app/404.html (links back to triage, front page, search) instead of
    # nginx's bare 404. Before the library is copied in, the file is absent and nginx falls back to its own page.
    error_page 404 /_app/404.html;
}
