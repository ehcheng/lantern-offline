#!/usr/sbin/nft -f
# Lantern host firewall (FIXES #152, a8 F3 / a6 F9; D4-A). Policy accept:
# the library, kiwix :8080 and kolibri :8081 stay open to every client.
#  - ssh only from 10.10.10.0/24, the wired subnet of eth0
#    (files/lantern-eth0.nmconnection: addresses=10.10.10.10/24; RUNBOOK: router
#    10.10.10.1/24, cabled laptop 10.10.10.20). Limit: the GL.iNet bridges its
#    Wi-Fi onto the same /24, so this rule alone does not make ssh cable-only.
#  - new ssh connections are limited to 20 a minute per address (burst 40), a
#    brake on scanning even though sshd takes keys only.
#  - lantern-mcp :8090 and embed :8091 / voice :8092 only from this host;
#    nginx proxies /mcp, /semantic, /stt. With the nginx 404 on /_app/mcp/ this
#    keeps the raw index and the dose text behind the server's guard.
flush ruleset
table inet lantern {
  chain input {
    type filter hook input priority 0; policy accept;
    iif lo accept
    ct state established,related accept
    tcp dport 22 ip saddr 10.10.10.0/24 ct state new meter ssh_new { ip saddr limit rate 20/minute burst 40 packets } accept
    tcp dport 22 drop
    tcp dport { 8090, 8091, 8092 } drop
  }
}
